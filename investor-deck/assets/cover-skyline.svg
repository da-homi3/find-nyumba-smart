    <rect x="435" y="195" width="8" height="10"/><rect x="450" y="195" width="8" height="10"/>
    <rect x="210" y="200" width="7" height="9"/><rect x="225" y="200" width="7" height="9"/>
    <rect x="240" y="200" width="7" height="9"/><rect x="255" y="200" width="7" height="9"/>
  </g>
  <!-- map pins -->
  <circle cx="250" cy="120" r="18" fill="#19995C" opacity="0.9"/>
  <path d="M250 138 L242 155 H258 Z" fill="#19995C"/>
  <circle cx="250" cy="120" r="6" fill="#FAFCFA"/>
  <circle cx="520" cy="95" r="14" fill="#3AB570" opacity="0.85"/>
