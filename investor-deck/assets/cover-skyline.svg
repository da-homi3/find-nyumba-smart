  <rect x="105" y="220" width="70" height="180" fill="#1B3D57" rx="2"/>
  <rect x="190" y="180" width="90" height="220" fill="#0F2A44" rx="2"/>
  <rect x="300" y="200" width="65" height="200" fill="#16324A" rx="2"/>
