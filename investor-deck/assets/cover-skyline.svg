      <stop offset="0%" stop-color="#0F2A44"/>
      <stop offset="100%" stop-color="#08192B"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#19995C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#91D64D" stop-opacity="0.1"/>
